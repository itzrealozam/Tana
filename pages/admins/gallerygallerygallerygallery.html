<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery Requests | Bikyoon</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="icon" type="image/png" href="/assets/paw.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #050709;
    --card: #111418;
    --card-hover: #1a1e23;
    --accent: #ff69b4;
    --accent-glow: rgba(255, 105, 180, 0.3);
    --text: #ffffff;
    --text-dim: #71717a;
    --danger: #ef4444;
    --success: #22c55e;
    --border: #27272a;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
}

/* Sidebar */
nav {
    width: 280px;
    background: var(--card);
    padding: 40px 20px;
    border-right: 1px solid var(--border);
    position: fixed;
    height: 100vh;
    display: flex;
    flex-direction: column;
    z-index: 100;
}

.logo {
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--accent);
    margin-bottom: 50px;
    text-shadow: 0 0 15px var(--accent-glow);
}

.nav-link {
    padding: 15px;
    margin-bottom: 5px;
    border-radius: 12px;
    cursor: pointer;
    color: var(--text-dim);
    transition: 0.2s;
    font-weight: 600;
    text-decoration: none;
}

.nav-link:hover, .nav-link.active {
    background: var(--card-hover);
    color: var(--text);
}

/* Main content */
main {
    margin-left: 280px;
    padding: 50px;
    width: calc(100% - 280px);
}

/* Tabs */
.header-tabs {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
}
.tab { cursor: pointer; padding: 10px 20px; border-radius: 8px; font-weight: 600; color: #71717a; transition: 0.3s; }
.tab.active { background: var(--accent); color: white; }

/* Grid of thumbnails */
.request-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
.req-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; transition: 0.3s; }
.req-card:hover { transform: scale(1.02); border-color: var(--accent); }
.req-card img { width: 100%; height: 200px; object-fit: cover; }
.req-info { padding: 12px; font-size: 13px; }

/* Modal */
.modal { 
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0,0,0,0.95); display: none; z-index: 1000;
    justify-content: center; align-items: center;
}
.modal-content { display: flex; width: 90%; max-width: 1200px; height: 80vh; gap: 30px; }
.modal-left { width: 300px; border-right: 1px solid var(--border); padding-right: 20px; }
.modal-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.modal-right { width: 250px; display: flex; flex-direction: column; gap: 15px; justify-content: center; }

.full-img { max-width: 100%; max-height: 80%; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
.btn-action { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; color: white; transition: 0.2s; }
.btn-approve { background: var(--success); }
.btn-museum { background: #f59e0b; }
.btn-reject { background: var(--danger); }
.close-modal { position: absolute; top: 20px; right: 20px; font-size: 30px; cursor: pointer; }

.btn-action:hover { filter: brightness(1.1); transform: translateY(-2px); }

</style>
</head>
<body>

<nav>
    <div class="logo">CONTROL YON 🐾</div>
    <a class="nav-link" href="/pages/admin.html">DASHBOARD</a>
    <a class="nav-link active" href="/pages/admins/gallerygallerygallerygallery.html">GALLERY ADMIN</a>
</nav>

<main>
    <h1>Pending Requests</h1>
    <div class="header-tabs">
        <div class="tab active" onclick="loadType('museum', this)">MUSEUM</div>
        <div class="tab" onclick="loadType('meme', this)">MEMES</div>
    </div>
    <div class="request-grid" id="gridArea"></div>
</main>

<div id="artModal" class="modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <div class="modal-content">
        <div class="modal-left">
            <h2 id="m-title" style="font-family: cursive;">Title</h2>
            <p style="color:#71717a">DETAILS</p>
            <div id="m-date" style="margin-bottom:20px">Date: --</div>
            <p style="color:#71717a">MESSAGE</p>
            <div id="m-msg" style="font-style: italic;">User message here...</div>
        </div>
        <div class="modal-center">
            <img id="m-img" class="full-img" src="">
        </div>
        <div class="modal-right">
            <button class="btn-action btn-museum" onclick="addToMuseum()">ADD TO MUSEUM</button>
            <button class="btn-action btn-approve" onclick="approveArtwork()">Approve Artwork</button>
            <div style="display:flex; gap:10px;">
                <button class="btn-action btn-reject" onclick="rejectArtwork()" style="background:#450a0a">Reject</button>
                <button class="btn-action btn-reject" onclick="banUser()">Ban</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentType = 'museum';
let selectedImage = null;

async function loadType(type, element) {
    currentType = type;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    element.classList.add('active');

    try {
        const res = await fetch(`/gallery/requests/${type}/images.json`);
        const data = await res.json();
        renderGrid(data);
    } catch (e) {
        document.getElementById('gridArea').innerHTML = "No pending requests.";
    }
}

function renderGrid(images) {
    const grid = document.getElementById('gridArea');
    grid.innerHTML = images.map((img, idx) => `
        <div class="req-card" onclick="openModal(${idx})">
            <img src="${img.url}">
            <div class="req-info">
                <strong>${img.title || 'Untitled'}</strong><br>
                <span style="color:gray">${img.date || ''}</span>
            </div>
        </div>
    `).join('');
    window.galleryData = images; // Store globally for modal actions
}

function openModal(index) {
    selectedImage = window.galleryData[index];
    document.getElementById('m-img').src = selectedImage.url;
    document.getElementById('m-title').innerText = selectedImage.title || "Untitled";
    document.getElementById('m-date').innerText = "Date: " + (selectedImage.date || "Unknown");
    document.getElementById('m-msg').innerText = selectedImage.message || "No message provided.";
    document.getElementById('artModal').style.display = 'flex';
}

function closeModal() { document.getElementById('artModal').style.display = 'none'; }

function addToMuseum() { alert(`Added "${selectedImage.title}" to Museum!`); }
function approveArtwork() { alert(`Approved "${selectedImage.title}"!`); }
function rejectArtwork() { alert(`Rejected "${selectedImage.title}"!`); }
function banUser() { alert(`Banned the user for "${selectedImage.title}"!`); }

// Initial load
loadType('museum', document.querySelector('.tab'));
</script>

</body>
</html>
