<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Museum ┃ Bikyoon</title>
<link rel="icon" type="image/png" href="/assets/paw.png">
<!-- Navbar placeholder -->
<div id="navbar-placeholder"></div>

<!-- Load navbar -->
<link rel="stylesheet" href="/navbar.css">
<script src="/navbar.js" defer></script>
<style>
:root {
    --bg-color: #ffffff;
    --accent-pink: #f8c8d3;
    --text-gray: #777;
    --hot-pink: #ff2d55;
    --overlay-dark: rgba(0,0,0,0.5);
    --like-size: 1.2rem;
    --transition-speed: 0.3s;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-gray);
    overflow-x: hidden;
    padding: 110px 20px;
}

/* --- Header --- */
header { text-align: center; margin-bottom: 50px; }
.gallery-badge {
    display: inline-block;
    border: 1.5px solid var(--accent-pink);
    color: #d88194;
    border-radius: 25px;
    padding: 4px 20px;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 15px;
}
h1 { font-weight: 300; font-size: 2.2rem; margin: 0; color: #555; }

/* --- Gallery Grid --- */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    grid-auto-flow: dense;
    grid-gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
}

.art-card {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: #f9f9f9;
    cursor: pointer;
    transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
}
.art-card:nth-child(3n) {
    grid-row: span 2;
}

.art-card:nth-child(5n) {
    grid-column: span 2;
}

.art-card:nth-child(7n) {
    grid-row: span 2;
    grid-column: span 2;
}
.art-card:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}
.art-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform var(--transition-speed) ease;
}

/* Hover overlay with likes */
.art-overlay {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: var(--overlay-dark);
    color: #fff;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    opacity: 0;
    transition: opacity var(--transition-speed) ease;
}
.art-card:hover .art-overlay { opacity: 1; }
.art-overlay span { display: flex; align-items: center; gap: 5px; }
.art-overlay svg { width: var(--like-size); height: var(--like-size); fill: #ff2d55; }

/* --- Fullscreen Overlay --- */
#tiktokOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 9999;
}
.close-btn {
    position: absolute; top: 20px; right: 20px;
    color: white; font-size: 2rem; cursor: pointer; z-index: 100;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.scroll-container {
    height: 100vh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
}
.scroll-container::-webkit-scrollbar { display: none; }

.video-slide {
    width: 100%;
    height: 100vh;
    scroll-snap-align: start;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    transition: padding-left 0.4s ease;
}
.video-slide.comments-active { padding-left: 350px; }
.video-slide img { max-width: 100%; max-height: 100vh; object-fit: contain; }

/* --- Sidebar Actions --- */
.side-bar {
    position: absolute;
    right: 15px;
    bottom: 100px;
    display: flex;
    flex-direction: column;
    gap: 25px;
    z-index: 30;
}
.btn-action {
    background: none; border: none; color: white;
    cursor: pointer; display: flex; flex-direction: column; align-items: center;
    transition: transform 0.2s ease;
}
.btn-action:hover { transform: scale(1.2); }
.btn-action svg { width: 35px; height: 35px; fill: white; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
.btn-action.active svg { fill: var(--hot-pink); }
.btn-action .count { margin-top: 5px; font-size: 0.85rem; }

/* --- Comment Drawer --- */
.comment-drawer {
    position: absolute;
    top: 0;
    left: -350px;
    width: 350px;
    height: 100%;
    background: white;
    transition: left 0.4s ease;
    z-index: 20;
    display: flex;
    flex-direction: column;
    color: #333;
    box-shadow: 5px 0 15px rgba(0,0,0,0.3);
}
.comment-drawer.open { left: 0; }
.drawer-header {
    padding: 20px;
    text-align: left;
    font-weight: bold;
    font-size: 1.2rem;
    border-bottom: 1px solid #eee;
    position: relative;
}
.comment-drawer .close-drawer-btn {
    position: absolute;
    top: 15px; right: 15px;
    font-size: 1.5rem;
    cursor: pointer;
    color: #555;
}
.comment-list {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    font-size: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.comment-bubble {
    background: #f1f1f1;
    padding: 12px;
    border-radius: 12px;
    border-bottom-left-radius: 2px;
    align-self: flex-start;
    width: 90%;
    line-height: 1.4;
}
.comment-input-area {
    padding: 20px;
    border-top: 1px solid #eee;
    background: #fff;
}
.drawer-input {
    width: 100%;
    padding: 12px 15px;
    border-radius: 25px;
    border: 1px solid #ddd;
    outline: none;
    box-sizing: border-box;
}

/* --- Responsive --- */
@media (max-width: 600px) {
    .comment-drawer { width: 80%; left: -80%; }
    .video-slide.comments-active { padding-left: 0; }
}

/* --- Scroll animation --- */
.video-slide img { transition: transform 0.3s ease; }
.video-slide.comments-active img { transform: scale(0.9); }

/* --- Like animation --- */
.like-animate {
    animation: likePop 0.3s ease forwards;
}
@keyframes likePop {
    0% { transform: scale(1); }
    50% { transform: scale(1.5); }
    100% { transform: scale(1); }
}
</style>
</head>
<body>

<header>
    <div class="gallery-badge">Exhibition</div>
    <h1>Museum of Bikyoon</h1>
</header>

<main class="gallery-grid" id="galleryContainer"></main>

<div id="tiktokOverlay">
    <div class="close-btn" onclick="closeTikTok()">&times;</div>
    <div class="scroll-container" id="snapContainer"></div>
</div>

<script>
let galleryData = [];
let commentsDB = {};

// --- Load Gallery ---
async function loadGallery() {
    const container = document.getElementById('galleryContainer');
    try {
        const response = await fetch('/gallery/approved/images.json');
        galleryData = await response.json();

        container.innerHTML = galleryData.map((img, index) => {
            commentsDB[index] = [];
            return `
            <div class="art-card" onclick="openTikTok(${index})">
                <img src="${img.url}" alt="Artwork">
                <div class="art-overlay">
                    <span>❤ <span class="overlay-count">0</span></span>
                </div>
            </div>`;
        }).join('');
    } catch (e) { console.error(e); }
}

// --- Open Overlay ---
function openTikTok(startIndex) {
    const overlay = document.getElementById('tiktokOverlay');
    const container = document.getElementById('snapContainer');
    overlay.style.display = 'block';
    document.body.style.overflow = 'hidden';
    

    container.innerHTML = galleryData.map((img, i) => `
    <div class="video-slide" id="slide-${i}">
        <img src="${img.url}">
        <div class="side-bar">
            <button class="btn-action" onclick="toggleLike(this, ${i})">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span class="count">0</span>
            </button>
            <button class="btn-action" onclick="toggleComments(${i})">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span id="comment-count-${i}">0</span>
            </button>
        </div>
        <div class="comment-drawer" id="drawer-${i}">
            <div class="drawer-header">
                Comments
                <span class="close-drawer-btn" onclick="toggleComments(${i})">&times;</span>
            </div>
            <div class="comment-list" id="list-${i}">
                <p style="color: #999; text-align: center; margin-top:20px;">Be the first to comment!</p>
            </div>
            <div class="comment-input-area">
                <input type="text" class="drawer-input" placeholder="Add a comment..." 
                    onkeypress="if(event.key === 'Enter') addComment(this, ${i})">
            </div>
        </div>
    </div>`).join('');

    document.getElementById(`slide-${startIndex}`).scrollIntoView();
    setTimeout(() => {
    galleryData.forEach((_, i) => loadComments(i));
}, 100);
}

// --- Toggle Comments ---
function toggleComments(index) {
    const slide = document.getElementById(`slide-${index}`);
    const drawer = document.getElementById(`drawer-${index}`);
    drawer.classList.toggle('open');
    slide.classList.toggle('comments-active');
}

// --- Add Comment ---
function addComment(input, index) {
    const text = input.value.trim();
    if (!text) return;

    const key = "comments_" + index;
    let comments = JSON.parse(localStorage.getItem(key)) || [];

    comments.push(text);
    localStorage.setItem(key, JSON.stringify(comments));

    input.value = '';
    loadComments(index);
}
function loadComments(index) {
    const list = document.getElementById(`list-${index}`);
    const countSpan = document.getElementById(`comment-count-${index}`);

    let comments = JSON.parse(localStorage.getItem("comments_" + index)) || [];

    countSpan.innerText = comments.length;

    if (comments.length === 0) {
        list.innerHTML = `<p style="color:#999;text-align:center;">Be the first to comment!</p>`;
        return;
    }

    list.innerHTML = comments.map(c => `
        <div class="comment-bubble"><strong>You</strong><br>${c}</div>
    `).join('');
}
// --- Update UI ---
function updateCommentUI(index) {
    const list = document.getElementById(`list-${index}`);
    const countSpan = document.getElementById(`comment-count-${index}`);
    countSpan.innerText = commentsDB[index].length;
    list.innerHTML = commentsDB[index].map(c => `
        <div class="comment-bubble"><strong>You</strong><br>${c}</div>
    `).join('');
    list.scrollTop = list.scrollHeight;
}

// --- Toggle Like ---
function toggleLike(btn, index) {
    const key = "likes_" + index;
    let liked = localStorage.getItem(key) === "true";

    let count = btn.querySelector('.count');
    let val = parseInt(count.innerText);

    if (!liked) {
        localStorage.setItem(key, "true");
        btn.classList.add('active');
        count.innerText = val + 1;
    } else {
        localStorage.setItem(key, "false");
        btn.classList.remove('active');
        count.innerText = Math.max(0, val - 1);
    }
}

// --- Close Overlay ---
function closeTikTok() {
    document.getElementById('tiktokOverlay').style.display = 'none';
    document.body.style.overflow = 'auto';
}

loadGallery();
</script>
</body>
</html>
