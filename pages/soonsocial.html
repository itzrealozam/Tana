<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon ┃ Bikyoon</title>
<link rel="icon" type="image/png" href="/assets/paw.png">
<!-- Navbar placeholder -->
<div id="navbar-placeholder"></div>

<!-- Load navbar -->
<link rel="stylesheet" href="/navbar.css">
<script src="/navbar.js" defer></script>
<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1a001f, #3c096c, #7b2cbf);
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
  overflow: hidden;
}

/* floating glow circles */
body::before,
body::after {
  content: "";
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.5;
}

body::before {
  background: #c77dff;
  top: -100px;
  left: -100px;
}

body::after {
  background: #7b2cbf;
  bottom: -100px;
  right: -100px;
}

.container {
  z-index: 1;
  max-width: 600px;
  padding: 40px;
}

/* title */
h1 {
  font-size: 3rem;
  margin-bottom: 10px;
}

/* subtitle */
p {
  font-size: 1.3rem;
  opacity: 0.8;
  margin-bottom: 30px;
}

/* animated dots */
.dots::after {
  content: "...";
  animation: dots 1.5s infinite;
}

@keyframes dots {
  0% { content: "."; }
  33% { content: ".."; }
  66% { content: "..."; }
}

/* button */
.button {
  display: inline-block;
  padding: 15px 30px;
  border-radius: 30px;
  background: white;
  color: #7b2cbf;
  text-decoration: none;
  font-weight: bold;
  transition: all 0.3s ease;
}

/* hover */
.button:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(255,255,255,0.3);
}

/* small glow text */
.brand {
  margin-top: 30px;
  font-size: 0.9rem;
  opacity: 0.6;
}
</style>

</head>

<body>

<div class="container">
  <h1>🚧 Coming Soon</h1>
  <p class="dots">Bikyoon doesn't have this page yet</p>

  <a href="../index.html" class="button">⬅ Return Home</a>

  <div class="brand">ozam2games © 2026</div>
</div>

</body>
</html>
