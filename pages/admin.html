<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Bikyoon</title>
<link rel="icon" type="image/png" href="/assets/paw.png">
<style>
    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #050709;
        color: #fff;
    }

    .login-box {
        background: #111418;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 0 25px rgba(255,105,180,0.3);
        width: 360px;
        text-align: center;
    }

    h1 {
        margin-bottom: 25px;
        font-size: 2rem;
        color: #ff69b4;
        text-shadow: 0 0 10px rgba(255,105,180,0.5);
    }

    input {
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        border: 1px solid #27272a;
        background: #000;
        color: #fff;
        font-size: 1rem;
        outline: none;
        margin-bottom: 20px;
    }

    input:focus { border-color: #ff69b4; }

    button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: #ff69b4;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        filter: brightness(1.2);
        transform: translateY(-2px);
    }

    .error {
        color: #ef4444;
        font-size: 0.9rem;
        margin-top: 10px;
        display: none;
    }
</style>
</head>
<body>

<div class="login-box">
    <h1>Admin Login</h1>
    <input type="text" id="adminName" placeholder="Enter Admin Name">
    <input type="password" id="adminPass" placeholder="Enter Password">
    <button onclick="checkLogin()">Login</button>
    <div class="error" id="errorMsg">Incorrect name or password!</div>
</div>

<script>
/* ===============================
   Admin Login Configuration
   =============================== */
const admins = [
    {
        name: "Ozam",
        password: "p09oi87uy65tr43ew21q",
        page: "/pages/admins/admin-ozam2game-p09oi87uy65tr43ew21qp09oi87uy65tr43ew21q.html"
    },
    {
        name: "Bikyoon",
        password: "yonhaanyonhaan",
        page: "/pages/admins/admin-bikyoon-yonhaanyonhaanyonhaanyonhaan.html"
    },
    {
        name: "anas",
        password: "Crati998croti889@366hophop.com",
        page: "/pages/admins/admin-anas-Crati998croti889@366hophop.comCrati998croti889@366hophop.comCrati998croti889@366hophop.com.html"
    },
    // Add more admins here easily
];

/* ===============================
   Check Name & Password
   =============================== */
function checkLogin() {
    const name = document.getElementById('adminName').value.trim();
    const pass = document.getElementById('adminPass').value.trim();
    const errorMsg = document.getElementById('errorMsg');

    // Find matching admin
    const admin = admins.find(a => a.name.toLowerCase() === name.toLowerCase() && a.password === pass);

    if(admin) {
        window.location.href = admin.page;
    } else {
        errorMsg.style.display = "block";
        setTimeout(() => { errorMsg.style.display = "none"; }, 3000);
    }
}

// Submit on Enter key
document.querySelectorAll('#adminName, #adminPass').forEach(input => {
    input.addEventListener('keyup', function(e){
        if(e.key === "Enter") checkLogin();
    });
});
</script>

</body>
</html>
